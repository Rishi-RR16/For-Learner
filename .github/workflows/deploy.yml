name: Build and Deploy
on:
  push:
    branches:
      - dev  # This matches the branch in your screenshot
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install and Build
        run: |
          npm install
          npx ng build --configuration production --base-href /<YOUR-REPO-NAME>/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/<YOUR-PROJECT-NAME> # Look in your angular.json for the project name
          branch: gh-pages # The branch where the website will live
