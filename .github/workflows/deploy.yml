name: Build and Deploy
on:
  push:
    branches:
      - dev
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Learn-Java  # <--- Change this to your folder name
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install and Build
        run: |
          npm install
          npx ng build --configuration production --base-href /For-Learner/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Learn-Java/dist/for-learner # <--- Change this folder name too
          branch: gh-pages
