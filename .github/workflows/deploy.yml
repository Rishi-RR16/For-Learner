name: Build and Deploy
on:
  push:
    branches:
      - dev
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # This tells GitHub to run commands inside your subfolder
    defaults:
      run:
        working-directory: YOUR-SUBFOLDER-NAME 
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install and Build
        run: |
          npm install
          npx ng build --configuration production --base-href /For-Learner/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: YOUR-SUBFOLDER-NAME/dist/for-learner
          branch: gh-pages
